{% extends "base.html" %}
{% block title %}Change password · Python Learning{% endblock %}
{% block content %}
  <section class="form-card narrow">
    <p class="eyebrow">Account security</p>
    <h1>Change password</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="current_password">Current password</label>
      <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required>
      <label for="password_confirmation">Confirm new password</label>
      <input id="password_confirmation" name="password_confirmation" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required>
      <button class="button" type="submit">Change password</button>
    </form>
    <p class="form-note">Changing your password signs out other active sessions.</p>
  </section>
{% endblock %}
