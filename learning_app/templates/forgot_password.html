{% extends "base.html" %}
{% block title %}Forgot password · Python Learning{% endblock %}
{% block content %}
  <section class="form-card narrow">
    <p class="eyebrow">Account recovery</p>
    <h1>Forgot password?</h1>
    <p>Enter your account email. If it matches an account, we’ll send a one-time reset link that expires in 30 minutes.</p>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
      <button class="button" type="submit">Send reset link</button>
    </form>
    <p class="form-note"><a href="{{ url_for('main.login') }}">Back to sign in</a></p>
  </section>
{% endblock %}
