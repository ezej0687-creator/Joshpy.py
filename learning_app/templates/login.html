{% extends "base.html" %}
{% block title %}Sign in · Joshtech{% endblock %}
{% block content %}
  <section class="form-card narrow">
    <p class="eyebrow">Welcome back</p>
    <h1>Sign in</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="username" maxlength="254" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="button" type="submit">Sign in</button>
    </form>
    <p class="form-note"><a href="{{ url_for('main.forgot_password') }}">Forgot password?</a></p>
    <p class="form-note">New here? <a href="{{ url_for('main.register') }}">Create an account</a>.</p>
  </section>
{% endblock %}
