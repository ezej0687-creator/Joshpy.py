{% extends "base.html" %}
{% block title %}Reset password · Joshtech{% endblock %}
{% block content %}
  <section class="form-card narrow">
    <p class="eyebrow">Account recovery</p>
    <h1>Choose a new password</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required>
      <label for="password_confirmation">Confirm new password</label>
      <input id="password_confirmation" name="password_confirmation" type="password" minlength="12" maxlength="1024" autocomplete="new-password" required>
      <button class="button" type="submit">Reset password</button>
    </form>
  </section>
{% endblock %}
